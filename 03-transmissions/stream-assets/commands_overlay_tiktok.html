<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #F3EFE8;
    --ink-dim: #96909F;
    --accent: #E7A93F;
    --accent-dim: rgba(231, 169, 63, 0.22);
    --border: rgba(231, 169, 63, 0.28);
    --panel: rgba(26, 23, 40, 0.92);
  }
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  .card {
    display: inline-block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 28px 20px;
    min-width: 250px;
    box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.55);
  }
  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--accent);
    text-transform: uppercase;
    margin: 0 0 6px;
    opacity: 0.85;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .rule {
    height: 1px;
    background: linear-gradient(90deg, var(--accent-dim), transparent 85%);
    margin: 10px 0 14px;
  }
  ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  li {
    font-size: 14.5px;
    color: var(--ink-dim);
    line-height: 1.3;
  }
  .bang {
    color: var(--accent);
    margin-right: 1px;
  }
  .studio {
    margin-top: 16px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 9.5px;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    text-transform: uppercase;
    opacity: 0.65;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Try one to see what it does</p>
    <h1>Commands</h1>
    <div class="rule"></div>
    <ul>
      <li><span class="bang">!</span>alert off</li>
      <li><span class="bang">!</span>alert on</li>
      <li><span class="bang">!</span>commands off</li>
      <li><span class="bang">!</span>commands on</li>
      <li><span class="bang">!</span>polarbear off</li>
      <li><span class="bang">!</span>polarbear on</li>
      <li><span class="bang">!</span>snow heavy</li>
      <li><span class="bang">!</span>snow light</li>
      <li><span class="bang">!</span>snow medium</li>
      <li><span class="bang">!</span>snow off</li>
      <li><span class="bang">!</span>snow storm</li>
      <li><span class="bang">!</span>catnova show</li>
      <li><span class="bang">!</span>catnova hide</li>
      <li><span class="bang">!</span>scene &lt;name&gt;</li>
    </ul>
    <p class="studio">S1NGULAR Studio &middot; Live</p>
  </div>
</body>
</html>
