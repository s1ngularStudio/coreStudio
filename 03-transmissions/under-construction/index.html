<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>(. )° Studio</title>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500&display=swap"
  />
  <style>
    :root {
      --paper: #fdfcfa;
      --ink: #16151c;
      --ink-soft: #6b6875;
      --accent: #e7a93f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--paper);
      color: var(--ink);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
      margin-bottom: 16px;
    }
    h1 {
      font-family: "Bebas Neue", Arial, sans-serif;
      font-size: clamp(48px, 12vw, 96px);
      letter-spacing: 0.02em;
      margin: 0 0 16px;
    }
    p {
      font-size: 13px;
      color: var(--ink-soft);
      max-width: 420px;
      line-height: 1.6;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="eyebrow">(. )&deg; Studio</div>
  <h1>Something's Coming</h1>
  <p>Most things digital &ndash; Check back soon.</p>
</body>
</html>
